name: Build Pomodoro Timer

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
    
    - name: Build with PyInstaller (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        pyinstaller --onefile --windowed --add-data "tomato.png:." --name pomodoro-timer main.py
    
    - name: Build with PyInstaller (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --onefile --windowed --add-data "tomato.png;." --name pomodoro-timer main.py
    
    - name: Rename executables
      shell: bash
      run: |
        if [ "$RUNNER_OS" == "Linux" ]; then
          mv dist/pomodoro-timer dist/pomodoro-timer-linux
        elif [ "$RUNNER_OS" == "macOS" ]; then
          mv dist/pomodoro-timer dist/pomodoro-timer-macos
        elif [ "$RUNNER_OS" == "Windows" ]; then
          mv dist/pomodoro-timer.exe dist/pomodoro-timer-windows.exe
        fi
    
    - name: Upload artifact (Linux)
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v3
      with:
        name: pomodoro-timer-linux
        path: dist/pomodoro-timer-linux
    
    - name: Upload artifact (macOS)
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v3
      with:
        name: pomodoro-timer-macos
        path: dist/pomodoro-timer-macos
    
    - name: Upload artifact (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v3
      with:
        name: pomodoro-timer-windows
        path: dist/pomodoro-timer-windows.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v3
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          pomodoro-timer-linux/pomodoro-timer-linux
          pomodoro-timer-macos/pomodoro-timer-macos
          pomodoro-timer-windows/pomodoro-timer-windows.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
